<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Shop</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <h1>My Shop</h1>
    <section>
        <h2>Categories</h2>
        <button data-category="All">All</button>
        <button data-category="Tech">Tech</button>
        <button data-category="Books">Books</button>
    </section>
    <section>
        <h2 class="products">Products list</h2>
        <ul id="prodlist1">
        </ul>
    </section>
    <section>
        <h2>Shopping cart:</h2>
        <p>
            Number of selected products: <span id="cart-count">0</span>
        </p>
        <ul id="cart-items"></ul>

        <p>Total: <span id="cart-total">0.00</span> eur</p>
    </section>
    <div id="tooltip"></div>
</body>

</html>
